<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>kakehashi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-tertiary: #252833;
      --bg-hover: #2a2d3a;
      --text-primary: #e4e4e7;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-claude: #d97706;
      --accent-chatgpt: #10b981;
      --accent-gemini: #6366f1;
      --accent-chatwork: #ef4444;
      --accent-blue: #3b82f6;
      --accent-yellow: #eab308;
      --border: #2e3140;
      --radius: 8px;
      --font-body: 'Noto Sans JP', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html.light {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f0f1f3;
      --bg-hover: #e8e9eb;
      --text-primary: #1a1a1a;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --border: #d1d5db;
    }

    html.light mark { background: rgba(59,130,246,.15); }
    html.light .service-badge.claude { background: rgba(217,119,6,.1); }
    html.light .service-badge.chatgpt { background: rgba(16,185,129,.1); }
    html.light .service-badge.gemini { background: rgba(99,102,241,.1); }
    html.light .service-badge.chatwork { background: rgba(239,68,68,.1); }
    html.light .tag-pill { background: rgba(59,130,246,.08); }
    html.light .toast { background: #fff; border-color: var(--border); }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; line-height: 1.5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .header { padding: 10px 14px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .logo { font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .logo-icon { width: 16px; height: 16px; border-radius: 3px; background: linear-gradient(135deg, var(--accent-claude), var(--accent-chatgpt), var(--accent-gemini)); }
    .status { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.active { background: var(--accent-chatgpt); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .tabs { display: flex; }
    .tab { flex: 1; padding: 8px 0; text-align: center; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; user-select: none; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--text-primary); border-bottom-color: var(--accent-blue); }
    .tab-count { font-family: var(--font-mono); font-size: 9px; background: var(--bg-tertiary); color: var(--text-muted); padding: 0 5px; border-radius: 8px; min-width: 18px; line-height: 16px; }
    .tab.active .tab-count { background: rgba(59,130,246,.2); color: var(--accent-blue); }

    .context-bar { padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: none; }
    .context-bar.visible { display: block; }
    .context-info { font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .keywords { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .keyword-tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border); font-family: var(--font-mono); }

    .search-bar { padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: none; }
    .search-bar.visible { display: block; }
    .search-input-wrap { display: flex; align-items: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; transition: border-color .15s; }
    .search-input-wrap:focus-within { border-color: var(--accent-blue); }
    .search-icon { color: var(--text-muted); font-size: 14px; flex-shrink: 0; margin-right: 6px; }
    .search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: var(--font-body); font-size: 13px; padding: 8px 0; }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 0 2px; display: none; line-height: 1; }
    .search-clear.visible { display: block; }
    .search-filters { display: flex; gap: 4px; margin-top: 8px; }
    .filter-btn { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-family: var(--font-mono); transition: all .15s; }
    .filter-btn:hover { border-color: var(--text-muted); color: var(--text-secondary); }
    .filter-btn.active { background: rgba(59,130,246,.15); border-color: var(--accent-blue); color: var(--accent-blue); }

    .content { flex: 1; overflow-y: auto; padding: 8px 14px; }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-family: var(--font-mono); margin: 8px 0 6px; }

    .file-card { padding: 10px 12px; margin: 6px 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); cursor: grab; transition: all .15s; position: relative; }
    .file-card:hover { border-color: var(--text-muted); background: var(--bg-hover); }
    .file-card.dragging { opacity: .5; border-color: var(--accent-claude); }
    .file-card.pinned { border-left: 3px solid var(--accent-yellow); }
    .file-card-header { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
    .file-icon { font-size: 14px; opacity: .7; }
    .file-card-title { font-size: 12px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-card-title.cw-title { white-space: normal; word-break: break-word; line-height: 1.4; -webkit-line-clamp: 3; display: -webkit-box; -webkit-box-orient: vertical; }
    .card-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .card-btn { background: none; border: 1px solid transparent; color: var(--text-muted); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: all .15s; padding: 0; }
    .card-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border); }
    .card-btn.fav-active { color: var(--accent-yellow); }
    .service-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; }
    .service-badge.claude { background: rgba(217,119,6,.15); color: var(--accent-claude); }
    .service-badge.chatgpt { background: rgba(16,185,129,.15); color: var(--accent-chatgpt); }
    .service-badge.gemini { background: rgba(99,102,241,.15); color: var(--accent-gemini); }
    .service-badge.chatwork { background: rgba(239,68,68,.15); color: var(--accent-chatwork); }
    .file-card-preview { font-size: 11px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
    .file-card-preview .ai-hint { color: var(--text-secondary); }
    .file-card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .tag-pill { font-size: 9px; padding: 0 5px; border-radius: 8px; background: rgba(59,130,246,.12); color: var(--accent-blue); font-family: var(--font-mono); }
    .file-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
    .match-pos { font-size: 9px; padding: 0 4px; border-radius: 3px; background: var(--bg-tertiary); }

    /* ── AI相談パネル (Chatwork用) ── */
    .ai-consult { padding: 4px 0; }
    .ai-consult-header { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
    .ai-consult-preview { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; font-size: 11px; color: var(--text-muted); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .ai-consult-preview .cw-speaker { color: var(--accent-blue); font-weight: 500; }
    .ai-consult-prompt { width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; color: var(--text-primary); font-size: 12px; font-family: var(--font-body); resize: vertical; min-height: 50px; outline: none; }
    .ai-consult-prompt:focus { border-color: var(--accent-blue); }
    .ai-consult-prompt::placeholder { color: var(--text-muted); }
    .ai-consult-buttons { display: flex; gap: 6px; margin-top: 8px; }
    .ai-btn { flex: 1; padding: 8px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text-primary); font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .ai-btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }
    .ai-btn.claude { border-color: rgba(217,119,6,.4); }
    .ai-btn.claude:hover { background: rgba(217,119,6,.1); }
    .ai-btn.chatgpt { border-color: rgba(16,185,129,.4); }
    .ai-btn.chatgpt:hover { background: rgba(16,185,129,.1); }
    .ai-btn.gemini { border-color: rgba(99,102,241,.4); }
    .ai-btn.gemini:hover { background: rgba(99,102,241,.1); }
    .ai-consult-count { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 6px; }
    .ai-consult-range { display: flex; gap: 4px; margin-bottom: 8px; }
    .range-btn { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-family: var(--font-mono); transition: all .15s; }
    .range-btn:hover { border-color: var(--text-muted); color: var(--text-secondary); }
    .range-btn.active { background: rgba(59,130,246,.15); border-color: var(--accent-blue); color: var(--accent-blue); }

    .expanded-view { display: none; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; max-height: 300px; overflow-y: auto; }
    .expanded-view.open { display: block; }
    .expanded-msg { margin-bottom: 6px; }
    .expanded-msg .role-label { font-size: 10px; font-weight: 600; margin-bottom: 1px; }
    .expanded-msg .role-label.user { color: var(--accent-blue); }
    .expanded-msg .role-label.assistant { color: var(--accent-chatgpt); }
    .expanded-msg .msg-text { font-size: 11px; color: var(--text-muted); white-space: pre-wrap; word-break: break-word; max-height: 100px; overflow: hidden; }
    .expand-toggle { font-size: 10px; color: var(--accent-blue); cursor: pointer; text-align: center; padding: 4px; }
    .expand-toggle:hover { text-decoration: underline; }

    .tag-input-row { display: none; gap: 4px; margin-top: 6px; }
    .tag-input-row.open { display: flex; }
    .tag-input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 11px; padding: 3px 6px; outline: none; font-family: var(--font-body); }
    .tag-input:focus { border-color: var(--accent-blue); }
    .tag-add-btn { background: var(--accent-blue); border: none; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer; }

    .ctx-menu { position: fixed; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 0; z-index: 200; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; }
    .ctx-menu.open { display: block; }
    .ctx-menu-item { padding: 6px 12px; font-size: 12px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .ctx-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .ctx-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

    .date-group { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); padding: 10px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .date-group:first-child { padding-top: 4px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state-icon { font-size: 24px; margin-bottom: 8px; opacity: .4; }
    .empty-state-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
    .empty-state p { font-size: 11px; line-height: 1.6; }
    .loading { text-align: center; padding: 20px; color: var(--text-muted); font-size: 11px; }
    .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin .6s linear infinite; margin-bottom: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-more { display: block; width: 100%; padding: 8px; margin: 8px 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-secondary); font-size: 11px; cursor: pointer; font-family: var(--font-body); transition: all .15s; }
    .load-more:hover { background: var(--bg-tertiary); border-color: var(--text-muted); }
    .drag-hint { font-size: 10px; color: var(--text-muted); text-align: center; padding: 4px; opacity: .6; }
    mark { background: rgba(59,130,246,.25); color: var(--text-primary); border-radius: 2px; padding: 0 1px; }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-tertiary); color: var(--text-primary); padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid var(--border); opacity: 0; transition: all .2s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .kbd-hint { position: fixed; bottom: 6px; right: 14px; font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); opacity: .4; }
    kbd { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; font-size: 9px; }

    /* ── 日付選択モーダル ── */
    .date-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center; }
    .date-modal-overlay.open { display: flex; }
    .date-modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 18px; width: 300px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
    .date-modal-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .date-modal-desc { font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; }
    .date-modal-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .date-label { font-size: 11px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 3px; }
    .date-input { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); padding: 6px 8px; font-size: 12px; font-family: var(--font-mono); outline: none; }
    .date-input:focus { border-color: var(--accent-blue); }
    .date-modal-hint { font-size: 10px; color: var(--text-muted); margin-bottom: 12px; }
    .date-modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .date-btn { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); font-family: var(--font-body); }
    .date-btn.cancel { background: transparent; color: var(--text-secondary); }
    .date-btn.cancel:hover { background: var(--bg-tertiary); }
    .date-btn.ok { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    .date-btn.ok:hover { opacity: .9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo"><div class="logo-icon"></div> kakehashi</div>
      <div class="status"><button class="card-btn" id="btn-export-date" title="日付指定で全会話エクスポート" style="margin-right:4px;font-size:14px;">📅</button><button class="card-btn" id="theme-toggle" title="テーマ切替" style="margin-right:4px;font-size:14px;">☀</button><div class="status-dot" id="status-dot"></div><span id="status-text">待機中</span></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="suggest"><span>✦</span> おすすめ <span class="tab-count" id="suggest-count">0</span></div>
      <div class="tab" data-tab="history"><span>↻</span> 履歴 <span class="tab-count" id="history-count">0</span></div>
      <div class="tab" data-tab="search"><span>⌕</span> 検索</div>
    </div>
  </div>
  <div class="context-bar" id="context-bar">
    <div class="context-info" id="context-info">会話を開くと関連する過去の会話を自動で探します</div>
    <div class="keywords" id="keywords"></div>
  </div>
  <div class="search-bar" id="search-bar">
    <div class="search-input-wrap"><span class="search-icon">⌕</span><input type="text" class="search-input" id="search-input" placeholder="キーワードで検索... ( / )"><button class="search-clear" id="search-clear">✕</button></div>
    <div class="search-filters">
      <button class="filter-btn active" data-service="all">すべて</button>
      <button class="filter-btn" data-service="claude">Claude</button>
      <button class="filter-btn" data-service="chatgpt">ChatGPT</button>
      <button class="filter-btn" data-service="gemini">Gemini</button>
      <button class="filter-btn" data-service="chatwork">CW</button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="tab-content active" id="tab-suggest"><div class="empty-state"><div class="empty-state-icon">🌉</div><div class="empty-state-title">関連会話を自動表示</div><p>AI で会話を開くと関連する過去の会話がここに表示されます</p></div></div>
    <div class="tab-content" id="tab-history"><div class="loading"><div class="loading-spinner"></div><div>読み込み中...</div></div></div>
    <div class="tab-content" id="tab-search"><div class="empty-state"><div class="empty-state-icon">⌕</div><div class="empty-state-title">会話を横断検索</div><p>キーワードを入力してすべてのサービスの会話を検索</p></div></div>
  </div>
  <div class="ctx-menu" id="ctx-menu">
    <div class="ctx-menu-item" data-action="download">📥 .txtダウンロード</div>
    <div class="ctx-menu-item" data-action="download-date">📅 日付指定エクスポート</div>
    <div class="ctx-menu-item" data-action="copy">⧉ テキストをコピー</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item" data-action="pin" id="ctx-pin">📌 ピン留め</div>
    <div class="ctx-menu-item" data-action="tag">🏷 タグを追加</div>
    <div class="ctx-menu-sep"></div>
    <div class="ctx-menu-item" data-action="open">🔗 元の会話を開く</div>
  </div>
  <!-- 日付選択モーダル -->
  <div class="date-modal-overlay" id="date-modal-overlay">
    <div class="date-modal">
      <div class="date-modal-title">📅 日付指定エクスポート</div>
      <div class="date-modal-desc" id="date-modal-desc"></div>
      <div class="date-modal-fields">
        <label class="date-label">開始日 <input type="date" id="date-from" class="date-input"></label>
        <label class="date-label">終了日 <input type="date" id="date-to" class="date-input"></label>
      </div>
      <div class="date-modal-hint" id="date-modal-hint"></div>
      <div class="date-modal-buttons">
        <button class="date-btn cancel" id="date-cancel">キャンセル</button>
        <button class="date-btn ok" id="date-ok">エクスポート</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="kbd-hint"><kbd>/</kbd> 検索 <kbd>Esc</kbd> 閉じる</div>
  <script src="sidepanel.js"></script>
</body>
</html>
